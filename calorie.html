<!DOCTYPE html>
<html>
<head>
<title>Calorie Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>

</head>
<body>

<a href="index.html">
<button>Back to Home</button>
</a>

<h1>Calorie Calculator</h1>

<label>Weight (kg)</label>
<input type="number" id="weight" placeholder="Example: 90">

<button onclick="calculateCalories()">Calculate</button>

<div id="result"></div>

<script>

function calculateCalories(){

let weight =
parseFloat(document.getElementById("weight").value);

if(!weight){
document.getElementById("result").innerHTML =
"Please enter your weight.";
return;
}

let calories = weight * 30;

document.getElementById("result").innerHTML =
"Estimated Daily Calories: " +
calories.toFixed(0) + " kcal";

}

</script>

</body>
</html>
