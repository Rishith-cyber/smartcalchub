<!DOCTYPE html>

<html>
<head>
<title>Mortgage Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
}
</style>

</head>

<body>
<a href="index.html"><button>Back to Home</button></a>
<h1>Mortgage Calculator</h1>

<label>Home Price (₹)</label> <input type="number" id="price" placeholder="Example: 5000000">

<label>Down Payment (₹)</label> <input type="number" id="down" placeholder="Example: 1000000">

<label>Annual Interest Rate (%)</label> <input type="number" id="rate" placeholder="Example: 8">

<label>Loan Term (Years)</label> <input type="number" id="years" placeholder="Example: 20">

<button onclick="calculateMortgage()">Calculate Mortgage</button>

<div id="result"></div>

<script>
function calculateMortgage(){

let price = parseFloat(document.getElementById("price").value);
let down = parseFloat(document.getElementById("down").value);
let annualRate = parseFloat(document.getElementById("rate").value);
let years = parseFloat(document.getElementById("years").value);

let loanAmount = price - down;
let monthlyRate = annualRate / 12 / 100;
let months = years * 12;

let monthlyPayment =
(loanAmount * monthlyRate * Math.pow(1 + monthlyRate, months)) /
(Math.pow(1 + monthlyRate, months) - 1);

let totalPayment = monthlyPayment * months;
let totalInterest = totalPayment - loanAmount;

document.getElementById("result").innerHTML =
"Loan Amount: ₹" + loanAmount.toFixed(2) +
"<br>Monthly Mortgage Payment: ₹" + monthlyPayment.toFixed(2) +
"<br>Total Interest: ₹" + totalInterest.toFixed(2) +
"<br>Total Payment: ₹" + totalPayment.toFixed(2);

}
</script>

</body>
</html>
