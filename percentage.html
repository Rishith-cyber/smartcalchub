<!DOCTYPE html>

<html>
<head>
<title>Percentage Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
}
</style>

</head>

<body>
<a href="index.html"><button>Back to Home</button></a>
<h1>Percentage Calculator</h1>

<label>Number</label> <input type="number" id="number">

<label>Percentage (%)</label> <input type="number" id="percent">

<button onclick="calculatePercentage()">Calculate</button>

<div id="result"></div>

<script>
function calculatePercentage(){

let number = parseFloat(document.getElementById("number").value);
let percent = parseFloat(document.getElementById("percent").value);

let result = (number * percent) / 100;

document.getElementById("result").innerHTML =
percent + "% of " + number + " = " + result;

}
</script>

</body>
</html>
