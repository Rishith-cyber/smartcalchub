<body>
<a href="index.html"><button>Back to Home</button></a>
<h1>BMI Calculator</h1>

<label>Height (cm)</label> <input type="number" id="height" placeholder="Enter height in cm">

<label>Weight (kg)</label> <input type="number" id="weight" placeholder="Enter weight in kg">

<button onclick="calculateBMI()">Calculate BMI</button>

<div id="result"></div>

<script>
function calculateBMI(){

let height =
parseFloat(document.getElementById("height").value)/100;

let weight =
parseFloat(document.getElementById("weight").value);

let bmi = weight/(height*height);

let category = "";

if(bmi < 18.5){
category = "Underweight";
}
else if(bmi < 25){
category = "Normal Weight";
}
else if(bmi < 30){
category = "Overweight";
}
else{
category = "Obese";
}

document.getElementById("result").innerHTML =
"BMI: " + bmi.toFixed(2) +
"<br>Category: " + category;

}
</script>
