<!DOCTYPE html>

<html>
<head>
<title>SIP Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>

</head>

<body>
<a href="index.html"><button>Back to Home</button></a>
<h1>SIP Calculator</h1>

<label>Monthly Investment (₹)</label> <input type="number" id="monthly" placeholder="Example: 5000">

<label>Expected Annual Return (%)</label> <input type="number" id="rate" placeholder="Example: 12">

<label>Investment Time (Years)</label> <input type="number" id="years" placeholder="Example: 10">

<button onclick="calculateSIP()">Calculate SIP</button>

<div id="result"></div>

<script>
function calculateSIP(){

let monthly = parseFloat(document.getElementById("monthly").value);
let annualRate = parseFloat(document.getElementById("rate").value);
let years = parseFloat(document.getElementById("years").value);

let monthlyRate = annualRate / 12 / 100;
let months = years * 12;

let futureValue = monthly * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate) * (1 + monthlyRate);
let investedAmount = monthly * months;
let returns = futureValue - investedAmount;

document.getElementById("result").innerHTML =
"Invested Amount: ₹" + investedAmount.toFixed(2) +
"<br>Estimated Returns: ₹" + returns.toFixed(2) +
"<br>Total Value: ₹" + futureValue.toFixed(2);

}
</script>

</body>
</html>
