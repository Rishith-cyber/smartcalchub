<!DOCTYPE html>

<html>
<head>
<title>Scientific Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:400px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{
text-align:center;
color:#2563eb;
}

#display{
width:100%;
height:60px;
font-size:24px;
text-align:right;
margin-bottom:10px;
padding:10px;
}

.buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

button{
padding:15px;
font-size:18px;
cursor:pointer;
border:none;
border-radius:5px;
background:#2563eb;
color:white;
}

button:hover{
opacity:0.9;
}
</style>

</head>

<body>
<a href="index.html"><button>Back to Home</button></a>
<h1>Scientific Calculator</h1>

<input type="text" id="display" readonly>

<div class="buttons">
<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('/')">÷</button>

<button onclick="append('4')">4</button> <button onclick="append('5')">5</button> <button onclick="append('6')">6</button> <button onclick="append('*')">×</button>

<button onclick="append('1')">1</button> <button onclick="append('2')">2</button> <button onclick="append('3')">3</button> <button onclick="append('-')">−</button>

<button onclick="append('0')">0</button> <button onclick="append('.')">.</button> <button onclick="calculate()">=</button> <button onclick="append('+')">+</button>

<button onclick="squareRoot()">√</button> <button onclick="percentage()">%</button> <button onclick="clearDisplay()">C</button> <button onclick="backspace()">⌫</button>

</div>

<script>
function append(value){
document.getElementById("display").value += value;
}

function calculate(){
try{
document.getElementById("display").value =
eval(document.getElementById("display").value);
}
catch{
alert("Invalid Expression");
}
}

function clearDisplay(){
document.getElementById("display").value="";
}

function backspace(){
let d=document.getElementById("display");
d.value=d.value.slice(0,-1);
}

function squareRoot(){
let d=document.getElementById("display");
d.value=Math.sqrt(parseFloat(d.value));
}

function percentage(){
let d=document.getElementById("display");
d.value=parseFloat(d.value)/100;
}
</script>

</body>
</html>
