<body>
<a href="index.html"><button>Back to Home</button></a>
<h1>Compound Interest Calculator</h1>

<label>Principal Amount (₹)</label> <input type="number" id="principal" placeholder="100000">

<label>Annual Interest Rate (%)</label> <input type="number" id="rate" placeholder="10">

<label>Time (Years)</label> <input type="number" id="years" placeholder="5">

<button onclick="calculateCI()">Calculate</button>

<div id="result"></div>

<script>
function calculateCI(){

let P = parseFloat(document.getElementById("principal").value);
let R = parseFloat(document.getElementById("rate").value)/100;
let T = parseFloat(document.getElementById("years").value);

let A = P * Math.pow((1 + R), T);
let CI = A - P;

document.getElementById("result").innerHTML =
"Final Amount: ₹" + A.toFixed(2) +
"<br>Compound Interest Earned: ₹" + CI.toFixed(2);

}
</script>
