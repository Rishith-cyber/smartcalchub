<h1>Countdown Calculator</h1>

<label>Select Future Date</label>

<input type="date" id="futureDate">

<button onclick="calculateCountdown()">Calculate</button>

<div id="result"></div>

<script>

function calculateCountdown(){

let futureDate =
new Date(document.getElementById("futureDate").value);

let today = new Date();

let diff =
futureDate - today;

let days =
Math.ceil(diff/(1000*60*60*24));

if(days<0){
document.getElementById("result").innerHTML =
"Please select a future date.";
}
else{
document.getElementById("result").innerHTML =
days + " days remaining";
}

}

</script>
