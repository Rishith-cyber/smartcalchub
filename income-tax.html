<body>

<h1>Income Tax Calculator</h1>

<label>Annual Income (₹)</label>
<input type="number" id="income" placeholder="Example: 800000">

<label>Deductions (₹)</label>
<input type="number" id="deductions" placeholder="Example: 50000">

<button onclick="calculateTax()">Calculate Tax</button>

<div id="result"></div>

<script>
function calculateTax(){

let income = parseFloat(document.getElementById("income").value);
let deductions = parseFloat(document.getElementById("deductions").value) || 0;

let taxable = income - deductions;
let tax = 0;

if(!income){
document.getElementById("result").innerHTML = "Please enter annual income.";
return;
}

if(taxable <= 300000){
tax = 0;
}
else if(taxable <= 600000){
tax = (taxable - 300000) * 0.05;
}
else if(taxable <= 900000){
tax = 15000 + (taxable - 600000) * 0.10;
}
else if(taxable <= 1200000){
tax = 45000 + (taxable - 900000) * 0.15;
}
else if(taxable <= 1500000){
tax = 90000 + (taxable - 1200000) * 0.20;
}
else{
tax = 150000 + (taxable - 1500000) * 0.30;
}

document.getElementById("result").innerHTML =
"Taxable Income: ₹" + taxable.toFixed(2) +
"<br>Estimated Tax: ₹" + tax.toFixed(2) +
"<br><small>This is only an estimate.</small>";

}
</script>

</body>
