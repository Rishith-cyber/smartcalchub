<body>

<h1>Loan Calculator</h1>

<label>Loan Amount (₹)</label> <input type="number" id="amount" placeholder="Example: 500000">

<label>Annual Interest Rate (%)</label> <input type="number" id="rate" placeholder="Example: 10">

<label>Loan Term (Years)</label> <input type="number" id="years" placeholder="Example: 5">

<button onclick="calculateLoan()">Calculate Loan</button>

<div id="result"></div>

<script>
function calculateLoan(){

let amount = parseFloat(document.getElementById("amount").value);
let annualRate = parseFloat(document.getElementById("rate").value);
let years = parseFloat(document.getElementById("years").value);

let monthlyRate = annualRate / 12 / 100;
let months = years * 12;

let monthlyPayment =
(amount * monthlyRate * Math.pow(1 + monthlyRate, months)) /
(Math.pow(1 + monthlyRate, months) - 1);

let totalPayment = monthlyPayment * months;
let totalInterest = totalPayment - amount;

document.getElementById("result").innerHTML =
"Monthly Payment: ₹" + monthlyPayment.toFixed(2) +
"<br>Total Interest: ₹" + totalInterest.toFixed(2) +
"<br>Total Payment: ₹" + totalPayment.toFixed(2);

}
</script>
