<html>
<head>

<script>
window.dataLayer = window.dataLayer || [];

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{color:#2563eb;}

input,select{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<a href="index.html">
<button>Back to Home</button>
</a>

<h1>Speed Converter</h1>

<label>Enter Speed</label>
<input type="number" id="speed" placeholder="Example: 100">

<label>From</label>
<select id="fromUnit">
<option value="kmh">Kilometer/hour</option>
<option value="ms">Meter/second</option>
<option value="mph">Miles/hour</option>
<option value="knots">Knots</option>
</select>

<label>To</label>
<select id="toUnit">
<option value="kmh">Kilometer/hour</option>
<option value="ms">Meter/second</option>
<option value="mph">Miles/hour</option>
<option value="knots">Knots</option>
</select>

<button onclick="convertSpeed()">Convert</button>

<div id="result"></div>

<script>
function convertSpeed(){

let value = parseFloat(document.getElementById("speed").value);
let from = document.getElementById("fromUnit").value;
let to = document.getElementById("toUnit").value;

if(!value){
document.getElementById("result").innerHTML = "Please enter speed.";
return;
}

let kmh = value;

if(from === "ms") kmh = value * 3.6;
if(from === "mph") kmh = value * 1.60934;
if(from === "knots") kmh = value * 1.852;

let result = kmh;

if(to === "ms") result = kmh / 3.6;
if(to === "mph") result = kmh / 1.60934;
if(to === "knots") result = kmh / 1.852;

document.getElementById("result").innerHTML =
value + " = " + result.toFixed(4);

}
</script>

</body>
</html>
