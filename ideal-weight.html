<!DOCTYPE html>
<html>
<head>
<title>Ideal Weight Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<a href="index.html">
<button>Back to Home</button>
</a>

<h1>Ideal Weight Calculator</h1>

<label>Height in cm</label>
<input type="number" id="height" placeholder="Example: 170">

<button onclick="calculateIdealWeight()">Calculate</button>

<div id="result"></div>

<script>
function calculateIdealWeight(){

let height = parseFloat(document.getElementById("height").value);

if(!height){
document.getElementById("result").innerHTML = "Please enter your height.";
return;
}

let ideal = (height - 100) * 0.9;

document.getElementById("result").innerHTML =
"Estimated Ideal Weight: " + ideal.toFixed(1) + " kg";

}
</script>

</body>
</html>
