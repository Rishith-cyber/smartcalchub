<!DOCTYPE html>
<html>
<head>
<title>Ratio Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{color:#2563eb;}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<a href="index.html">
<button>Back to Home</button>
</a>

<h1>Ratio Calculator</h1>

<label>First Number</label>
<input type="number" id="num1">

<label>Second Number</label>
<input type="number" id="num2">

<button onclick="calculateRatio()">Calculate Ratio</button>

<div id="result"></div>

<script>

function gcd(a,b){
return b ? gcd(b,a%b) : a;
}

function calculateRatio(){

let a = parseInt(document.getElementById("num1").value);
let b = parseInt(document.getElementById("num2").value);

if(!a || !b){
document.getElementById("result").innerHTML =
"Please enter both numbers.";
return;
}

let g = gcd(a,b);

document.getElementById("result").innerHTML =
"Simplified Ratio: " + (a/g) + ":" + (b/g);

}

</script>

</body>
</html>
