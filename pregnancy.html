<!DOCTYPE html>
<html>
<head>
<title>Pregnancy Due Date Calculator - SmartCalc Hub</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:700px;
margin:auto;
padding:20px;
background:#f4f7fb;
}

h1{
color:#2563eb;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:5px;
cursor:pointer;
}

#result{
margin-top:20px;
padding:15px;
background:white;
border-radius:8px;
font-size:20px;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
</style>

</head>
<body>

<a href="index.html">
<button>Back to Home</button>
</a>

<h1>Pregnancy Due Date Calculator</h1>

<label>Last Menstrual Period (LMP)</label>
<input type="date" id="lmp">

<button onclick="calculateDueDate()">Calculate</button>

<div id="result"></div>

<script>

function calculateDueDate(){

let lmp =
new Date(document.getElementById("lmp").value);

if(isNaN(lmp)){
document.getElementById("result").innerHTML =
"Please select a date.";
return;
}

let dueDate = new Date(lmp);

dueDate.setDate(
dueDate.getDate() + 280
);

document.getElementById("result").innerHTML =
"Estimated Due Date: " +
dueDate.toDateString();

}

</script>

</body>
</html>
